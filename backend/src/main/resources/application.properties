# Spring Boot Application Configuration
server.port=8080

# Database Configuration (to be configured based on environment)
spring.datasource.url=jdbc:mysql://localhost:3306/fleet_management
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Jackson Configuration
spring.jackson.serialization.write_dates_as_timestamps=false

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration (SRS Appendix D: HS256, secret from environment, role-specific expiry)
jwt.secret=${JWT_SECRET_KEY:DevOnlyJwtSecretKeyForLocalDevelopment0123456789ABCDEF}
jwt.expiration-ms-user=28800000
jwt.expiration-ms-staff=43200000
jwt.expiration-ms-admin=86400000

# Fleet business rules (SRS Appendix F)
fleet.maintenance.odometer-interval-km=10000
fleet.speeding-threshold-kmh=80
fleet.gps.stale-minutes=5
