# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/fleet_management
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update

# JWT Configuration (HS256, secret from environment, role-specific expiry)
jwt.secret=${JWT_SECRET_KEY:DevOnlyJwtSecretKeyForLocalDevelopment0123456789ABCDEF}
jwt.expiration-ms-user=28800000
jwt.expiration-ms-staff=43200000
jwt.expiration-ms-admin=86400000

# Fleet business rules (SRS Appendix F)
fleet.maintenance.odometer-interval-km=10000
fleet.speeding-threshold-kmh=80
fleet.gps.stale-minutes=5
