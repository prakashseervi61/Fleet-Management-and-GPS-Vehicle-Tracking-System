# Test profile: H2 in-memory database
spring.datasource.url=jdbc:h2:mem:fleet_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

jwt.secret=TestOnlyJwtSecretKeyForUnitTests0123456789ABCDEF
jwt.expiration-ms-user=28800000
jwt.expiration-ms-staff=43200000
jwt.expiration-ms-admin=86400000
